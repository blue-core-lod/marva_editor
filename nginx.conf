server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /marva/;
  }

  # Emitted by the health endpoint vite plugin (src/lib/health.js) at build time.
  # Both paths are served so the container answers the same way the dev server does.
  location = /health {
    alias /usr/share/nginx/html/marva/health;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location = /marva/health {
    alias /usr/share/nginx/html/marva/health;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location /marva/util/ {
    proxy_pass http://marva-keycloak-middleware:9401/marva/util/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /marva/ {
    try_files $uri $uri/ /marva/index.html;
  }
}
