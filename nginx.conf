server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /marva/;
  }

  # Health probe for the Blue Core dashboard. The payload is written at image
  # build time from the release tag (see Dockerfile); the exact-match location
  # wins over /marva/ below, and root is inherited so the file resolves as
  # /usr/share/nginx/html/marva/health.
  location = /marva/health {
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location /marva/util/ {
    proxy_pass http://marva-keycloak-middleware:9401/marva/util/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /marva/ {
    try_files $uri $uri/ /marva/index.html;
  }
}
