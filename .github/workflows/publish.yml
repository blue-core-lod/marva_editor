name: Build and Release Docker Image

# BUILD ON PUSH TO bluecore-main BRANCH
on:
  push:
    branches: [bluecore-main]
  release:
    types: [published]
  workflow_dispatch: {}


jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Baked into the image and reported by /marva/health. Releases report
      # their tag (e.g. v3.11); branch builds report the branch and commit.
      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          [ -n "$VERSION" ] || VERSION="$GITHUB_REF_NAME-$(git rev-parse --short HEAD)"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push marva editor :latest
        env:
          MARVA_IMAGE: ghcr.io/blue-core-lod/marva
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build --build-arg MARVA_VERSION="$VERSION" -t $MARVA_IMAGE:latest .
          docker push $MARVA_IMAGE:latest
          if [ -n "$RELEASE_TAG" ]; then
            docker tag $MARVA_IMAGE:latest "$MARVA_IMAGE:$RELEASE_TAG"
            docker push "$MARVA_IMAGE:$RELEASE_TAG"
          fi

      - name: Build and push marva keycloak middleware :latest
        env:
          MARVA_KEYCLOAK_MIDDLEWARE_IMAGE: ghcr.io/blue-core-lod/marva-keycloak-middleware
        run: |
          docker build \
            -f Dockerfile.middleware \
            -t $MARVA_KEYCLOAK_MIDDLEWARE_IMAGE:latest .
          docker push $MARVA_KEYCLOAK_MIDDLEWARE_IMAGE:latest
